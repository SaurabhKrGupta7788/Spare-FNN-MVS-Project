project:
  name: sparse_ffn_mvs
  seed: 42

# Hugging Face Hub identifiers. Both resources are public; HF_TOKEN is optional.
huggingface:
  dataset_id: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  model_id: facebook/opt-125m
  revision: main
  cache_dir: null  # null uses the normal Hugging Face cache (HF_HOME can relocate it)

data:
  processed_dir: data/processed/wikitext2
  # WikiText-2 already has official train, validation and test splits.
  splits: [train, validation, test]
  block_size: 128
  tokenize_batch_size: 1000

extraction:
  output_dir: artifacts/activations
  batch_size: 2
  num_workers: 0
  # Safe pilot default. Set max_batches: 0 to process the full selected split.
  max_batches: 20
  storage_dtype: float16  # float16 or float32
  device: auto            # auto, cpu, cuda

analysis:
  output_dir: artifacts/analysis
  histogram_sample_size: 100000
  random_seed: 42
  histogram_bins: 60

# Research-question analysis settings. These commands use the Phase 1 activation run.
rq1:
  confidence_level: 0.95

rq2:
  max_neurons: 128
  max_tokens: 50000
  min_activation_frequency: 0.01
  max_activation_frequency: 0.99
  random_seed: 42
  cluster_distance_threshold: 0.7

rq3:
  max_samples: 5000
  pca_components: 64
  factor_analysis_max_neurons: 256
  factor_counts: [2, 5, 10]
  min_activation_frequency: 0.01
  max_activation_frequency: 0.99
  rotation: varimax
  max_iter: 200
  random_seed: 42

rq4:
  seed: 42
  weights_path: null

rq5:
  max_samples: 1000
  pca_reduced_components: 8
  target_layer: "layer_00"
  random_seed: 42

